<form id="add-form" class="form-horizontal form-ajax" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <div class="form-group">
        <label for="c-name" class="control-label col-xs-12 col-sm-2">店铺名:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" data-rule="required;length(1~128)" class="form-control" name="row[name]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label for="c-logo" class="control-label col-xs-12 col-sm-2">Logo:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-logo" class="form-control" size="50" name="row[logo]" type="text" value="">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-logo" class="btn btn-danger faupload" data-input-id="c-logo" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="false" data-preview-id="p-logo"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-logo" class="btn btn-primary fachoose" data-input-id="c-logo" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-logo"></ul>
        </div>
    </div>

    <!-- 位置(纯手动输入) -->
    <div class="form-group">
        <label for="c-position" class="control-label col-xs-12 col-sm-2">位置:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-position" data-rule="length(1~255)" class="form-control" name="row[position]" type="text" value="" placeholder="如：北京市朝阳区xxx路">
        </div>
    </div>

    <!-- 经纬度(可选,小程序端按需使用) -->
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">经纬度:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="row">
                <div class="col-xs-4">
                    <label class="control-label" style="font-weight:normal;color:#999;">经度</label>
                    <input id="c-longitude" class="form-control" name="row[longitude]" type="number" step="0.000001" placeholder="116.404">
                </div>
                <div class="col-xs-4">
                    <label class="control-label" style="font-weight:normal;color:#999;">纬度</label>
                    <input id="c-latitude" class="form-control" name="row[latitude]" type="number" step="0.000001" placeholder="39.915">
                </div>
            </div>
            <p class="help-block" style="color:#999;">选填,小程序端按经纬度显示距离/排序用</p>
        </div>
    </div>

    <!-- 营业时间:两个 time picker,自动组合 HH:MM-HH:MM -->
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">营业时间:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="row">
                <div class="col-xs-4">
                    <label class="control-label" style="font-weight:normal;color:#999;">开始</label>
                    <input id="c-bh-start" class="form-control" type="time" value="08:00">
                </div>
                <div class="col-xs-4">
                    <label class="control-label" style="font-weight:normal;color:#999;">结束</label>
                    <input id="c-bh-end" class="form-control" type="time" value="18:00">
                </div>
            </div>
            <input id="c-business_hours" class="form-control" name="row[business_hours]" type="hidden" value="08:00-18:00">
            <p class="help-block" style="color:#999;">选择开始/结束时间,自动组合成 HH:MM-HH:MM 存库</p>
        </div>
    </div>

    <div class="form-group">
        <label for="c-contact_phone" class="control-label col-xs-12 col-sm-2">联系电话:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-contact_phone" data-rule="mobile" class="form-control" name="row[contact_phone]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label for="c-intro" class="control-label col-xs-12 col-sm-2">简介:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-intro" class="form-control" name="row[intro]" rows="3"></textarea>
        </div>
    </div>

    <!-- 微信信息(M2+):采购商"加微信"功能用 -->
    <div class="form-group">
        <label for="c-wechat_qrcode" class="control-label col-xs-12 col-sm-2">微信二维码:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-wechat_qrcode" class="form-control" size="50" name="row[wechat_qrcode]" type="text" value="">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-wechat_qrcode" class="btn btn-danger faupload" data-input-id="c-wechat_qrcode" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="false" data-preview-id="p-wechat_qrcode"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-wechat_qrcode" class="btn btn-primary fachoose" data-input-id="c-wechat_qrcode" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-wechat_qrcode"></ul>
            <p class="help-block" style="color:#999;">采购商在小程序点击"加微信"时展示,长按可保存到相册</p>
        </div>
    </div>
    <div class="form-group">
        <label for="c-wechat_name" class="control-label col-xs-12 col-sm-2">微信号:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-wechat_name" data-rule="length(1~64)" class="form-control" name="row[wechat_name]" type="text" value="" placeholder="如:fruit_lao_zhang">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">是否认证:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[certified]', ['1'=>'已认证', '0'=>'未认证'], '0')}
            <p class="help-block" style="color:#999;">已认证店铺在小程序头部展示"✓ 认证"徽章</p>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', ['1'=>'启用', '0'=>'停用'], '1')}
        </div>
    </div>
    <div class="form-group hidden layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>

<!-- 营业时间:两个 time picker 联动到 hidden business_hours -->
<script>
(function syncHours(){
    var start = document.getElementById('c-bh-start');
    var end   = document.getElementById('c-bh-end');
    var hidden= document.getElementById('c-business_hours');
    function sync(){
        var s = start.value || '08:00';
        var e = end.value   || '18:00';
        hidden.value = s + '-' + e;
    }
    start.addEventListener('change', sync);
    end.addEventListener('change', sync);
    sync();
})();
</script>
