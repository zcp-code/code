<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Cat_name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-cat_name" data-rule="required" class="form-control" name="row[cat_name]" type="text" value="{$row.cat_name|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Cat_idname')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-cat_idname" data-rule="required" class="form-control" name="row[cat_idname]" type="text" value="{$row.cat_idname|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Cat_remark')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-cat_remark" class="form-control " rows="5" name="row[cat_remark]" cols="50">{$row.cat_remark|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <div class="radio">
            {foreach name="statusList" item="vo"}
            <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label> 
            {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Cat_width')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-cat_width" data-rule="required" class="form-control" name="row[cat_width]" type="number" value="{$row.cat_width|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Cat_height')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-cat_height" data-rule="required" class="form-control" name="row[cat_height]" type="number" value="{$row.cat_height|htmlentities}">
        </div>
    </div>
    <!--<div class="form-group">-->
        <!--<label class="control-label col-xs-12 col-sm-2">{:__('Cat_url')}:</label>-->
        <!--<div class="col-xs-12 col-sm-8">-->
            <!--<input id="c-cat_url" data-rule="required" class="form-control" name="row[cat_url]" type="text" value="{$row.cat_url|htmlentities}">-->
        <!--</div>-->
    <!--</div>-->
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
