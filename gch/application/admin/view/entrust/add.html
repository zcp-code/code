<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Type')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <div class="radio">
            {foreach name="typeList" item="vo"}
            <label for="row[type]-{$key}"><input id="row[type]-{$key}" name="row[type]" type="radio" value="{$key}" {in name="key" value="buy"}checked{/in} /> {$vo}</label> 
            {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" data-rule="required;length(1~50)" class="form-control" name="row[name]" type="text" value="" placeholder="{:__('Name placeholder')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Phone')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-phone" data-rule="required;mobile" class="form-control" name="row[phone]" type="text" value="" placeholder="{:__('Phone placeholder')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Community')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-community_name" class="form-control" name="row[community_name]" type="text" value="" placeholder="{:__('Community placeholder')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Area')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-area" class="form-control" name="row[area]" type="text" value="" placeholder="{:__('Area placeholder')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('House_type')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-house_type" class="form-control" name="row[house_type]" type="text" value="" placeholder="{:__('House_type placeholder')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Source')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <div class="radio">
            {foreach name="sourceList" item="vo"}
            <label for="row[source]-{$key}"><input id="row[source]-{$key}" name="row[source]" type="radio" value="{$key}" {in name="key" value="entrust"}checked{/in} /> {$vo}</label> 
            {/foreach}
            </div>

        </div>
    </div>

<!--        <div class="col-xs-12 col-sm-8">-->
<!--            <input id="c-house_id" data-source="house/index" class="form-control selectpage" name="row[house_id]" type="text" value="">-->
<!--        </div>-->
<!--    </div>-->

<!--        <label class="control-label col-xs-12 col-sm-2">{:__('Agent_id')}:</label>-->

<!--            <input id="c-agent_id" data-source="agent/index" class="form-control selectpage" name="row[agent_id]" type="text" value="">-->
<!--        </div>-->
<!--    </div>-->
<!--    <div class="form-group">-->
<!--        <label class="control-label col-xs-12 col-sm-2">{:__('Remark')}:</label>-->
<!--        <div class="col-xs-12 col-sm-8">-->
<!--            <textarea id="c-remark" class="form-control " rows="4" name="row[remark]" cols="50"></textarea>-->
<!--        </div>-->
<!--    </div>-->
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
