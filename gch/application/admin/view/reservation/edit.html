<form id="edit-form" class="form-horizontal form-ajax" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">预订编号:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" type="text" value="{$row.reservation_no|htmlentities}" readonly>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">货品:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" type="text" value="{$row.goods_name|htmlentities}" readonly>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">店铺:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" type="text" value="{$row.shop_id|htmlentities}" readonly>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">单价:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" type="text" value="¥{$row.price|htmlentities}" readonly>
        </div>
    </div>
    <div class="form-group">
        <label for="c-quantity" class="control-label col-xs-12 col-sm-2">数量:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-quantity" data-rule="required;integer" class="form-control" name="row[quantity]" type="number" value="{$row.quantity|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', ['pending'=>'待确认', 'confirmed'=>'已确认', 'cancelled'=>'已取消'], $row['status'])}
        </div>
    </div>
    <div class="form-group">
        <label for="c-cancel_reason" class="control-label col-xs-12 col-sm-2">取消原因:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-cancel_reason" class="form-control" name="row[cancel_reason]" type="text" value="{$row.cancel_reason|htmlentities}">
        </div>
    </div>
    <div class="form-group hidden layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
