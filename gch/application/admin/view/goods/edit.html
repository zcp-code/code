<form id="edit-form" class="form-horizontal form-ajax" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">货盘编号:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" type="text" value="{$row.goods_no|htmlentities}" readonly>
        </div>
    </div>
    <div class="form-group">
        <label for="c-name" class="control-label col-xs-12 col-sm-2">品名:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" data-rule="required;length(1~128)" class="form-control" name="row[name]" type="text" value="{$row.name|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-price" class="control-label col-xs-12 col-sm-2">单价(元):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-price" data-rule="required;float" class="form-control" name="row[price]" type="number" step="0.01" value="{$row.price|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-unit" class="control-label col-xs-12 col-sm-2">单位:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-unit" data-rule="required;length(1~16)" class="form-control" name="row[unit]" type="text" value="{$row.unit|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-total_stock" class="control-label col-xs-12 col-sm-2">总库存:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-total_stock" data-rule="required;integer" class="form-control" name="row[total_stock]" type="number" value="{$row.total_stock|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">已预订:</label>
        <div class="col-xs-12 col-sm-8">
            <input class="form-control" type="text" value="{$row.reserved_quantity|htmlentities}" readonly>
            <p class="help-block">由下单/取消自动维护，请勿手动修改</p>
        </div>
    </div>
    <div class="form-group">
        <label for="c-description" class="control-label col-xs-12 col-sm-2">描述:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-description" class="form-control" name="row[description]" rows="3">{$row.description|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', ['1'=>'在售', '0'=>'已下架', '2'=>'售罄'], $row['status'])}
        </div>
    </div>
    <div class="form-group hidden layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
