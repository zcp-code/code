server {
    listen        1992;
    server_name  www.gch.local;
    root   "F:/2026/GCH/code/gch/public";

    # 日志
    access_log  F:/2026/GCH/code/gch/runtime/nginx_access.log;
    error_log   F:/2026/GCH/code/gch/runtime/nginx_error.log;

    # 客户端大小（图片上传）
    client_max_body_size 20M;

    # 上传路径静态资源（本地存储，expires 30d）
    location ^~ /uploads/ {
        expires 30d;
        access_log off;
    }

    # ThinkPHP 路由：所有不存在的文件请求都重写到 index.php
    location / {
        if (!-e $request_filename) {
            rewrite ^/(.*)$ /index.php?s=$1 last;
        }
    }

    # PHP 处理
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_connect_timeout 60;
        fastcgi_read_timeout    300;
        fastcgi_send_timeout    300;

        fastcgi_buffer_size 64k;
        fastcgi_buffers   4 64k;
        fastcgi_busy_buffers_size 128k;
    }

    # 禁止访问敏感文件
    location ~ /\.(ht|env|git|svn) {
        deny all;
    }

    location ~ /(application|thinkphp|extend|addons|vendor|runtime)/ {
        deny all;
    }
}
